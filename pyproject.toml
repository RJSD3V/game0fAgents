[project]
name = "game0fagents"
version = "0.1.0"
description = "A Conway-style cellular automaton governed by an LLM quorum-sensing agent, with ClickHouse telemetry and Langfuse tracing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=1.9.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langfuse>=4.16.0",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]

pythonpath = [
    ".",
    "src",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
